name: Deploy Firestore rules and indexes

# Runs when the rules/indexes change on main, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once.
concurrency:
  group: deploy-firestore
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check configuration
        env:
          SA_KEY: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          [ -n "$SA_KEY" ]  || { echo "::error::Secret FIREBASE_DEPLOY_SERVICE_ACCOUNT is not set"; exit 1; }
          [ -n "$PROJECT" ] || { echo "::error::Secret FIREBASE_PROJECT_ID is not set"; exit 1; }
          echo "$SA_KEY" | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8"))' \
            || { echo "::error::FIREBASE_DEPLOY_SERVICE_ACCOUNT is not valid JSON"; exit 1; }
          node -e 'JSON.parse(require("fs").readFileSync("firestore.indexes.json","utf8"))' \
            || { echo "::error::firestore.indexes.json is not valid JSON"; exit 1; }

      - name: Deploy rules and indexes
        env:
          SA_KEY: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          KEY_FILE="$RUNNER_TEMP/firebase-deploy-key.json"
          umask 077
          printf '%s' "$SA_KEY" > "$KEY_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          npx --yes firebase-tools@13.35.1 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$PROJECT" \
            --non-interactive
